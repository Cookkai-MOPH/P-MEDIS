  <meta name="referrer" content="no-referrer">
  <title>P-MEDIS - ระบบสารสนเทศเพื่อบริหารจัดการข้อมูลกำลังคนแพทย์ ในสังกัดสำนักงานสาธารณสุขจังหวัดปัตตานี</title>

  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff;
      overscroll-behavior: none;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: 0;
      display: block;
      background: #ffffff;
    }

    /* ================= Loading screen ================= */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      background: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 42%, #E6F7F6 100%);
      font-family: 'IBM Plex Sans Thai', 'Leelawadee UI', Tahoma, sans-serif;
      transition: opacity .6s ease, visibility .6s ease;
    }
    #loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }

    /* ฉากลายเส้น 1920x1080 ย่อ/ขยายให้เต็มจอ (cover) ยึดขอบล่างกลางจอ */
    #scene {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: 50% 100%;
      transform: translateX(-50%);
    }

    /* ---------- โลโก้ + ข้อความ (responsive) ---------- */
    #brand {
      position: absolute;
      left: 0; right: 0;
      top: max(14vh, calc(env(safe-area-inset-top) + 32px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 0 20px;
      z-index: 2;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: clamp(18px, 3vw, 44px);
    }
    .brand-logo { width: clamp(96px, 11vw, 210px); height: auto; overflow: visible; }
    .brand-text { display: flex; flex-direction: column; gap: 10px; }
    .brand-title {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: clamp(44px, 5.4vw, 104px);
      line-height: 1;
      letter-spacing: -0.025em;
      color: #0B2545;
    }
    .brand-title span { color: #D6336C; }
    .brand-en {
      font-family: 'Sora', sans-serif;
      font-weight: 500;
      font-size: clamp(10px, .9vw, 17px);
      letter-spacing: .3em;
      text-transform: uppercase;
      color: #0F766E;
    }
    .brand-th { font-size: clamp(14px, 1.15vw, 22px); font-weight: 500; color: #334E68; }
    .status {
      font-size: clamp(13px, .95vw, 16px);
      color: #0F766E;
      letter-spacing: .02em;
    }
    .status::after {
      content: '';
      display: inline-block;
      width: 1.2em;
      text-align: left;
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75%, 100% { content: '...'; }
    }

    @media (max-width: 640px) {
      .brand-row { flex-direction: column; text-align: center; gap: 16px; }
      .brand-text { align-items: center; }
      .brand-en { letter-spacing: .18em; }
    }

    /* ---------- Animation ของโลโก้ ---------- */
    .pm .pm-signal, .pm .pm-ring { opacity: 0; }
    .pm-cross, .pm-dot, .pm-ring { transform-box: fill-box; transform-origin: center; }
    .pm .pm-line   { stroke-dasharray: 100; animation: pmDraw 1.8s cubic-bezier(.65,0,.35,1) both; }
    .pm .pm-signal { animation: pmSig 2.6s linear 1.9s infinite; }
    .pm .pm-cross  { animation: pmBeat 1.3s ease-in-out 1.9s infinite; }
    .pm .pm-dot    { animation: pmPop .5s ease-out 1.6s both; }
    .pm .pm-ring   { animation: pmRing 1.3s ease-out 2s infinite; }
    @keyframes pmDraw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes pmSig  { 0% { stroke-dashoffset: 7; opacity: 1; } 100% { stroke-dashoffset: -93; opacity: 1; } }
    @keyframes pmBeat { 0%,100% { transform: scale(1); } 14% { transform: scale(1.2); } 28% { transform: scale(1); } 42% { transform: scale(1.1); } 56% { transform: scale(1); } }
    @keyframes pmPop  { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
    @keyframes pmRing { 0% { transform: scale(1); opacity: .75; } 100% { transform: scale(2.6); opacity: 0; } }

    /* ---------- Animation ของฉากพื้นหลัง ---------- */
    .bg-waves { animation: bgDrift 16s linear infinite; }
    @keyframes bgDrift { from { transform: translateX(0); } to { transform: translateX(-160px); } }
    .bg-boat { transform-origin: 50% 80%; animation: bgBob 5s ease-in-out infinite; }
    @keyframes bgBob { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-7px) rotate(-0.8deg); } }
    .bg-flower { transform-box: fill-box; transform-origin: center; animation: bgSway 10s ease-in-out infinite; }
    @keyframes bgSway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    .bg-pulse { animation: bgPulse 7s linear infinite; }
    @keyframes bgPulse { from { stroke-dashoffset: 4; } to { stroke-dashoffset: -96; } }
    .bg-twinkle { animation: bgTw 4s ease-in-out infinite; }
    @keyframes bgTw { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      #loader *, #loader *::after { animation: none !important; }
      #loader { transition: none; }
      .pm .pm-line { stroke-dashoffset: 0; }
    }
  </style>

          <path class="pm-line" pathLength="100" d="M34 100 V44 A26 26 0 1 1 60 70 H68 L74 58 L82 84 L88 70 H96" fill="none" stroke="url(#gBg)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="pm-signal" pathLength="100" d="M34 100 V44 A26 26 0 1 1 60 70 H68 L74 58 L82 84 L88 70 H96" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 93"/>

  <iframe
    id="app"
    title="P-MEDIS - ระบบสารสนเทศเพื่อบริหารจัดการข้อมูลกำลังคนแพทย์ ในสังกัดสำนักงานสาธารณสุขจังหวัดปัตตานี"
    allow="fullscreen"
    allowfullscreen
    frameborder="0"
    scrolling="no"
    referrerpolicy="no-referrer"></iframe>

  <script>
    (function () {
      // URL จริงของ Apps Script
      var parts = [
        "https://script.google.com/macros/s/",
        "AKfycbxeiyD30KlozOmcJy7SlpwV5zbJmiNe9HskGBqEBPyJEk14HBthA7i58F0m9T7cgUg",
        "/exec"
      ];

      var frame  = document.getElementById("app");
      var loader = document.getElementById("loader");
      var status = document.getElementById("status");
      var scene  = document.getElementById("scene");
      var done = false;

      // ย่อ/ขยายฉาก 1920x1080 ให้เต็มจอทุกขนาด (แบบ cover)
      function fitScene() {
        var s = Math.max(window.innerWidth / 1920, window.innerHeight / 1080);
        scene.style.transform = "translateX(-50%) scale(" + s + ")";
      }
      fitScene();
      window.addEventListener("resize", fitScene);

      function hideLoader() {
        if (done) return;
        done = true;
        loader.classList.add("hide");
        window.removeEventListener("resize", fitScene);
        setTimeout(function () { loader.style.display = "none"; }, 700);
      }

      frame.addEventListener("load", hideLoader);

      setTimeout(function () { if (!done) status.textContent = "กำลังเชื่อมต่อ กรุณารอสักครู่"; }, 6000);
      setTimeout(hideLoader, 25000);

      frame.src = parts.join("") + (location.search || "");
    })();
  </script>
