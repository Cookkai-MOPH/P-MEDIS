<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c81">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="P-MEDIS">
  <meta name="description" content="P-MEDIS - ระบบสารสนเทศเพื่อบริหารจัดการข้อมูลกำลังคนแพทย์ ในสังกัดสำนักงานสาธารณสุขจังหวัดปัตตานี">
  <meta name="referrer" content="no-referrer">
  <title>P-MEDIS - ระบบสารสนเทศเพื่อบริหารจัดการข้อมูลกำลังคนแพทย์ ในสังกัดสำนักงานสาธารณสุขจังหวัดปัตตานี</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;          /* กัน address bar มือถือบัง */
      overflow: hidden;        /* ไม่มี scrollbar */
      background: #ffffff;
      overscroll-behavior: none;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;           /* fallback เบราว์เซอร์เก่า */
      height: 100dvh;
      border: 0;
      display: block;
      background: #ffffff;
    }

    /* ---------- Loading screen ---------- */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      background: linear-gradient(160deg, #0f4c81 0%, #1b6fae 55%, #2a9d8f 100%);
      color: #ffffff;
      font-family: "Sarabun", "Noto Sans Thai", "Leelawadee UI", "Tahoma", sans-serif;
      text-align: center;
      transition: opacity .6s ease, visibility .6s ease;
    }
    #loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }

    .logo {
      font-size: clamp(36px, 9vw, 56px);
      font-weight: 800;
      letter-spacing: 2px;
    }
    .subtitle {
      max-width: 560px;
      font-size: clamp(14px, 3.6vw, 17px);
      line-height: 1.6;
      opacity: .92;
    }
    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(255,255,255,.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    .status { font-size: 14px; opacity: .8; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2.5s; }
      #loader { transition: none; }
    }
  </style>
</head>
<body>

  <div id="loader" role="status" aria-live="polite">
    <div class="logo">P-MEDIS</div>
    <div class="subtitle">
      ระบบสารสนเทศเพื่อบริหารจัดการข้อมูลกำลังคนแพทย์<br>
      ในสังกัดสำนักงานสาธารณสุขจังหวัดปัตตานี
    </div>
    <div class="spinner" aria-hidden="true"></div>
    <div class="status" id="status">กำลังโหลดระบบ...</div>
  </div>

  <iframe
    id="app"
    title="P-MEDIS - ระบบสารสนเทศเพื่อบริหารจัดการข้อมูลกำลังคนแพทย์ ในสังกัดสำนักงานสาธารณสุขจังหวัดปัตตานี"
    allow="fullscreen"
    allowfullscreen
    frameborder="0"
    scrolling="no"
    referrerpolicy="no-referrer"></iframe>

  <script>
    (function () {
      // URL จริงของ Apps Script (ประกอบตอนรันเพื่อไม่ให้อยู่ใน HTML attribute ตรง ๆ)
      var parts = [
        "https://script.google.com/macros/s/",
        "AKfycby2Y3Js_dNjq2cghpPbxMuKaXosFdI6PHP-t3KjyjTjoWyRDs2tewTSAEBs5K7O4Op1",
        "/exec"
      ];

      var frame  = document.getElementById("app");
      var loader = document.getElementById("loader");
      var status = document.getElementById("status");
      var done = false;

      function hideLoader() {
        if (done) return;
        done = true;
        loader.classList.add("hide");
        setTimeout(function () { loader.style.display = "none"; }, 700);
      }

      frame.addEventListener("load", hideLoader);

      // ข้อความแจ้งเมื่อโหลดนาน และ fallback ปิด loading กันค้าง
      setTimeout(function () { if (!done) status.textContent = "กำลังเชื่อมต่อ กรุณารอสักครู่..."; }, 6000);
      setTimeout(hideLoader, 25000);

      // ส่งต่อ query string ของโดเมนคุณไปยัง Apps Script (เช่น ?page=report)
      frame.src = parts.join("") + (location.search || "");
    })();
  </script>
</body>
</html>
